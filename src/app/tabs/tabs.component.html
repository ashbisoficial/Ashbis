<ion-tabs>
  <ion-tab-bar slot="bottom">

    <!-- 1. Pestaña Home -->
    <!-- 'href' usa el RouterLink que importamos en el .ts -->
    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label> <!-- 'ion-label' también se importa -->
    </ion-tab-button>

    <!-- 2. Pestaña Listar Mascotas: oculta para veterinario — esa cuenta
         accede a pacientes ajenos por PIN (pestaña Veterinario), no tiene
         mascotas propias. -->
    <ion-tab-button *ngIf="!esVeterinario" tab="listar-mascotas" href="/tabs/listar-mascotas">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Mis Mascotas</ion-label>
    </ion-tab-button>

    <!-- 3. Buscador: directorio público de veterinarios y servicios
         registrados en Ashbis. Fijo para todos, igual que Home/Mis
         Mascotas/Perfil — cualquier rol puede necesitar buscar. -->
    <ion-tab-button tab="buscador" href="/tabs/buscador">
      <ion-icon name="search-outline"></ion-icon>
      <ion-label>Buscador</ion-label>
    </ion-tab-button>

    <!-- 4. Pestaña Refugio (dueño y colaboradores): hub único de todo lo
         del refugio — mascotas, publicaciones, equipo, veterinarias,
         estadísticas, finanzas y chat del equipo. -->
    <ion-tab-button *ngIf="hrefRefugio" tab="refugio-panel" [href]="hrefRefugio">
      <ion-icon name="paw-outline"></ion-icon>
      <ion-label>Refugio</ion-label>
    </ion-tab-button>

    <!-- 4.5. Pestaña Veterinario (solo cuentas rol 'veterinario'): panel con
         "mis pacientes" y acceso al historial médico por PIN. -->
    <ion-tab-button *ngIf="esVeterinario" tab="veterinario-panel" href="/tabs/veterinario-panel">
      <ion-icon name="medkit-outline"></ion-icon>
      <ion-label>Veterinario</ion-label>
    </ion-tab-button>

    <!-- 4.6. Pestaña Servicio (solo cuentas rol 'servicio': peluquería,
         guardería, funeraria): panel con los datos del negocio. -->
    <ion-tab-button *ngIf="esServicio" tab="servicio-panel" href="/tabs/servicio-panel">
      <ion-icon name="storefront-outline"></ion-icon>
      <ion-label>Servicio</ion-label>
    </ion-tab-button>

    <!-- 4.7. Pestaña Pyme (solo cuentas rol 'pyme': marcas/emprendimientos
         que venden productos para mascotas): panel con los datos de la marca. -->
    <ion-tab-button *ngIf="esPyme" tab="pyme-panel" href="/tabs/pyme-panel">
      <ion-icon name="bag-handle-outline"></ion-icon>
      <ion-label>Pyme</ion-label>
    </ion-tab-button>

    <!-- 5. Pestaña Perfil -->
    <ion-tab-button tab="perfil" href="/tabs/perfil">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
