<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>
    <ion-title>🐾 Ashbis IA</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="reiniciarChat()">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="chat-content">

  <!-- Historial de mensajes -->
  <div class="messages-container" #scrollContainer>
    <div
      *ngFor="let m of mensajes"
      class="message-bubble"
      [class.user]="m.autor === 'Tu'"
      [class.ia]="m.autor === 'Ashbis IA'"
    >
      <div class="bubble-inner">
        <p class="texto">{{ m.texto }}</p>
        <span class="hora">{{ m.hora }}</span>
      </div>
    </div>

    <!-- Spinner de carga -->
    <div *ngIf="cargando" class="message-bubble ia">
      <div class="bubble-inner loading-bubble">
        <ion-spinner name="dots" color="primary"></ion-spinner>
      </div>
    </div>
  </div>

  <!-- Paso 1: elegir categoría -->
  <div *ngIf="pasoActual === 1" class="chips-panel">
    <p class="chips-hint">Elige un tema:</p>
    <div class="chips-grid">
      <ion-chip
        *ngFor="let cat of categorias"
        (click)="seleccionarCategoria(cat)"
        color="primary"
        outline="true"
      >
        <ion-label>{{ cat.label }}</ion-label>
      </ion-chip>
    </div>
  </div>

  <!-- Paso 2: elegir tipo de mascota -->
  <div *ngIf="pasoActual === 2" class="chips-panel">
    <p class="chips-hint">¿Qué tipo de mascota tienes?</p>
    <div class="chips-grid">
      <ion-chip
        *ngFor="let tipo of tiposMascota"
        (click)="seleccionarMascota(tipo)"
        color="secondary"
        outline="true"
      >
        <ion-label>{{ tipo.label }}</ion-label>
      </ion-chip>
    </div>
  </div>

  <!-- Paso 3: input de pregunta -->
  <div *ngIf="pasoActual === 3" class="input-panel">
    <ion-input
      [(ngModel)]="mensaje"
      placeholder="Escribe tu pregunta..."
      [disabled]="cargando"
      (keyup.enter)="enviarPregunta()"
      class="chat-input"
      fill="outline"
      shape="round"
    ></ion-input>
    <ion-button
      (click)="enviarPregunta()"
      [disabled]="!mensaje.trim() || cargando"
      shape="round"
      color="primary"
    >
      <ion-icon name="send-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>

</ion-content>
