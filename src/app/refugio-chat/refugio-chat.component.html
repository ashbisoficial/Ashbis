<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/refugio-panel"></ion-back-button>
    </ion-buttons>
    <ion-title>Chat · {{ nombreRefugio() }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="chat-content">

  <div class="messages-container" #scrollContainer>
    <div class="ion-text-center ion-padding" *ngIf="cargando()">
      <ion-spinner></ion-spinner>
    </div>

    <p class="vacio" *ngIf="!cargando() && !mensajes().length">
      Todavía no hay mensajes. Escribe el primero para avisarle algo al equipo.
    </p>

    <div class="message-bubble" *ngFor="let m of mensajes(); trackBy: trackById"
         [class.propio]="m.autorUid === miUid">
      <div class="bubble-inner">
        <p class="autor" *ngIf="m.autorUid !== miUid">{{ m.autorNombre }}</p>
        <p class="texto">{{ m.texto }}</p>
        <span class="hora">{{ horaDe(m) }}</span>
      </div>
    </div>
  </div>

</ion-content>

<!-- ion-footer (no un div suelto dentro de ion-content): así la barra de
     escribir queda SIEMPRE pegada abajo del viewport, sin que el scroll del
     contenido ni el teclado la desplacen — mismo criterio que WhatsApp. -->
<ion-footer class="input-footer">
  <div class="input-panel">
    <ion-input
      class="chat-input"
      placeholder="Escribe un mensaje…"
      [(ngModel)]="texto"
      (keyup.enter)="enviar()"
      [disabled]="enviando"
      fill="outline"
      shape="round"
    ></ion-input>
    <ion-button (click)="enviar()" [disabled]="!texto.trim() || enviando" shape="round" color="danger">
      <ion-icon name="send-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
