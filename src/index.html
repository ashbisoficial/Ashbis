<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ashbis</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="theme-color" content="#8b0808" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Agregar a pantalla de inicio en iOS -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Ashbis" />
  <link rel="apple-touch-icon" href="assets/icon/pwa/icon-180.png" />
</head>

<body>
  <app-root></app-root>

  <!-- Pantalla de carga con marca, visible hasta que Angular termina de
       arrancar (login/carga inicial). Se oculta sola por CSS apenas
       <app-root> tiene contenido — ver global.scss. -->
  <div id="boot-splash" aria-hidden="true">
    <img src="assets/img/logo_ashbis.jpeg" alt="" class="boot-splash-logo" />
    <div class="boot-splash-spinner"></div>
  </div>
</body>

</html>
